<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Login</title>
    <link rel="stylesheet" href="../../assets/global-css/default.css">
    <link rel="stylesheet" href="../../assets/global-css/fonts.css">
    <link rel="stylesheet" href="../assets/loginPages.css">
    <link rel="stylesheet" href="privateLoginStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="src/login.js"></script>
</head>

<body>
    <div class="windowWrapper flexCol">
        <div class="window flexColNotCenter">
            <div class="windowContent flexCol">
                <div class="titleWrapper flexCol">
                    <h1>Login to <span class="appName">kanban.</span></h1>
                </div>
                <form class="login flexCol">
                    <div class="inputWrapper flexCol">
                        <label for="username">Enter your username:</label>
                        <input type="text" id="username" placeholder="destroyer123" name="username">
                    </div>

                    <div class="inputWrapper flexCol">
                        <label for="password">Enter your password:</label>
                        <input type="password" id="password" placeholder="exel3ntP@ssw0rd321">
                    </div>

                    <button type="submit" class="loginBtn animateOnHover">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
