<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Home page</title>

    <link rel="stylesheet" href="../assets/global-css/fonts.css">
    <link rel="stylesheet" href="../assets/global-css/default.css">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6.3.7/animations/shift-away.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>

    <script type="module" src="./src/home.js" type="module" defer></script>
    <script type="module" src="./src/UI/windows/addTask.js" type="module" defer></script>
</head>

<body>
    <nav class="flex">
        <div class="menuBtn">☰</div>
        <h1 class="appName">kanban.</h1>
        <button class="logoutBtn btn">Logout</button>
    </nav>

    <div class="sidebar flexColNotCenter">
        <h2>Your projects</h2>

        <div class="colSeparator"></div>

        <div class="projectBtnWrapper">

        </div>
    </div>

    <div class="projectsWrapper">
        <div class="home">
            <h1>Hello!</h1>
            <h2>Choose a project or...</h2>
            <h2>...create a new one to get started!</h2>
        </div>
    </div>

    <div class="windowsWrapper flex">
        <div class="window addTaskWindow flexColNotCenter">
            <button class="closeBtn animateOnHover">
                <img src="../assets/img/close.png" alt="Close">
            </button>

            <h1>Add task</h1>
            <form class="addTaskForm flexColNotCenter">
                <input id="addTaskName" type="text" placeholder="Name" required>

                <textarea id="addTaskDescription" placeholder="Description"></textarea>

                <div class="optionWrapper addTaskColumnWrapper flex">
                    <label for="addTaskColumn">Column:</label>
                    <select id="addTaskColumn" required>
                        <option value="1">22143124</option>
                        <option value="2">c2</option>
                        <option value="3">c3</option>
                    </select>
                </div>

                <div class="separator"></div>

                <div class="addTaskSubtasksOptionWrapper flexColNotCenter">
                    <h3>Subtasks</h3>

                    <div class="addTaskSubtasksWrapper flexColNotCenter"></div>

                    <button type="button" class="addTaskAddSubtaskBtn animateOnHover">+</button>
                </div>

                <button type="submit" class="btn addTaskSubmitBtn animateOnHover flex">Add</button>
            </form>

        </div>
        <div class="window hidden"></div>
        <div class="window hidden"></div>
        <div class="window hidden"></div>
        <div class="window hidden"></div>
    </div>
</body>

</html>
