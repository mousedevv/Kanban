<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Home page</title>

    <link rel="stylesheet" href="../assets/global-css/fonts.css">
    <link rel="stylesheet" href="../assets/global-css/default.css">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6.3.7/animations/shift-away.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>

    <script type="module" src="./src/home.js" type="module" defer></script>
    <script type="module" src="./src/UI/windows/addTask.js" type="module" defer></script>
    <script type="module" src="./src/UI/windows/addColumn.js" type="module" defer></script>
    <script type="module" src="./src/UI/windows/createProject.js" type="module" defer></script>
</head>

<body>
    <nav class="flex">
        <div class="menuBtn">☰</div>
        <h1 class="appName">kanban.</h1>
        <button class="logoutBtn btn">Logout</button>
    </nav>

    <div class="sidebar flexColNotCenter">
        <h2>Your projects</h2>

        <div class="colSeparator"></div>

        <div class="projectBtnWrapper">

        </div>
    </div>

    <div class="projectsWrapper scroll">
        <div class="home">
            <h1>Hello!</h1>
            <h2>Choose a project or...</h2>
            <h2>...create a new one to get started!</h2>
        </div>
    </div>

    <div class="windowsWrapper flex">
        <!-- CREATE PROJECT WINDOW -->
        <div class="window createProjectWindow flexColNotCenter hidden">
            <button class="closeBtn animateOnHover">
                <img src="../assets/img/close.png" alt="Close">
            </button>

            <h1>Create new project</h1>
            <form class="createProjectForm addForm flexColNotCenter">
                <input id="createProjectName" type="text" placeholder="Name" required>

                <textarea id="createProjectDescription" placeholder="Description"></textarea>

                <button type="submit" class="btn addSubmitBtn animateOnHover flex">Create</button>
            </form>
        </div>

        <!-- ADD COLUMN WINDOW -->
        <div class="window addColumnWindow flexColNotCenter hidden">
            <button class="closeBtn animateOnHover">
                <img src="../assets/img/close.png" alt="Close">
            </button>

            <h1>Add column</h1>
            <form class="addColumnForm addForm flexColNotCenter">
                <input id="addColumnName" type="text" placeholder="Name" required>

                <button type="submit" class="btn addSubmitBtn animateOnHover flex">Add</button>
            </form>
        </div>

        <!-- ADD TASK WINDOW -->
        <div class="window addTaskWindow flexColNotCenter hidden">
            <button class="closeBtn animateOnHover">
                <img src="../assets/img/close.png" alt="Close">
            </button>

            <h1>Add task</h1>
            <form class="addTaskForm addForm flexColNotCenter">
                <input id="addTaskName" type="text" placeholder="Name" required>

                <textarea id="addTaskDescription" placeholder="Description"></textarea>

                <div class="separator"></div>

                <div class="addTaskSubtasksOptionWrapper flexColNotCenter">
                    <h3>Subtasks</h3>

                    <div class="addTaskSubtasksWrapper flexColNotCenter"></div>

                    <button type="button" class="addTaskAddSubtaskBtn addBtn animateOnHover">+</button>
                </div>

                <button type="submit" class="btn addSubmitBtn animateOnHover flex">Add</button>
            </form>
        </div>

        <div class="window projectSettingsWindow flexColNotCenter">
            <button class="closeBtn animateOnHover">
                <img src="../assets/img/close.png" alt="Close">
            </button>

            <h1>Project settings</h1>
            <form class="projectSettingsForm addForm flexColNotCenter">
                <input id="projectSettingsName" type="text" placeholder="Name" required>

                <textarea id="projectSettingsDescription" placeholder="Description"></textarea>

                <div class="separator"></div>

                <div class="dangerZoneProjectSettings">
                    <h2 class="dangerZoneTitle">
                        Danger zone <br>
                        <p class="dangerZoneTitleSmaller">Do not proceed if you don't know what you're doing!</p>
                    </h2>

                    <button type="button" class="btn deleteProjectBtn animateOnHover flex">Delete project</button>
                </div>
        </div>
        <div class="window hidden"></div>
    </div>
</body>

</html>
