<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../assets/global-css/fonts.css">
    <link rel="stylesheet" href="../../assets/global-css/default.css">
    <script type="module" src="src/403.js"></script>
</head>

<body>
    <div class="messageWrapper flexCol">
        <div class="message flexCol">
            <h1 class="errorTitle">403 Forbidden</h1>
            <p class="errorDescription">Sorry, you don't have permission to access this page or project.</p>
            <p class="redirectText">
                <span>Redirecting to a <a class="redirectHref" href="../../home"> home page </a> in </span>
                <span class="timeToRedirect">5...</span>
            </p>
        </div>
    </div>
</body>

</html>
